<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD166"/>
      <stop offset="50%"  stop-color="#F7B500"/>
      <stop offset="100%" stop-color="#F27121"/>
    </linearGradient>

    <pattern id="diamond" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="none"/>
      <polygon points="10,0 20,10 10,20 0,10" fill="rgba(255,255,255,0.22)"/>
    </pattern>

    <clipPath id="clip1">
      <text x="100" y="210" text-anchor="middle"
            font-family="Impact, 'Arial Black', Arial, sans-serif"
            font-weight="900" font-size="200">1</text>
    </clipPath>
  </defs>

  <!-- Layer 1: White outer stroke -->
  <text x="100" y="210" text-anchor="middle"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-weight="900" font-size="200"
        fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round">1</text>

  <!-- Layer 2: Dark navy inner stroke -->
  <text x="100" y="210" text-anchor="middle"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-weight="900" font-size="200"
        fill="none" stroke="#1D1D46" stroke-width="6" stroke-linejoin="round">1</text>

  <!-- Layer 3: Gold gradient fill -->
  <text x="100" y="210" text-anchor="middle"
        font-family="Impact, 'Arial Black', Arial, sans-serif"
        font-weight="900" font-size="200"
        fill="url(#goldGrad)">1</text>

  <!-- Layer 4: Diamond pattern overlay -->
  <rect width="200" height="240" fill="url(#diamond)" clip-path="url(#clip1)"/>
</svg>
